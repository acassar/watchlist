# Nginx du conteneur « web » : sert le front (PWA) et relaie /api vers NestJS.
# Le TLS et les journaux d'accès sont gérés par le Nginx du VPS, devant ce conteneur.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Le Nginx du VPS journalise déjà chaque requête : pas de doublon d'IP ici.
    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ajoute l'IP du Nginx du VPS à la chaîne : l'API remonte jusqu'au client (TRUST_PROXY).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
    }

    # Fichiers versionnés par Vite (hash dans le nom) : cache d'un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker, manifest et page d'accueil : toujours revalidés, sinon la
    # PWA resterait bloquée sur une ancienne version.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
