# Nginx du VPS (hôte) : /etc/nginx/sites-available/canapact.adrien-cassar.fr
# Ne touche à aucun autre site. Après `certbot --nginx -d canapact.adrien-cassar.fr`,
# Certbot ajoute lui-même le bloc 443 (certificat Let's Encrypt) et la
# redirection HTTP -> HTTPS. Les lignes `listen 80` ci-dessous restent valables.

server {
    listen 80;
    listen [::]:80;
    server_name canapact.adrien-cassar.fr;

    # Journaux propres à Canapact (rotation : /etc/logrotate.d/nginx).
    access_log /var/log/nginx/canapact.access.log;
    error_log /var/log/nginx/canapact.error.log;

    client_max_body_size 1m;

    # HSTS : à décommenter une fois le HTTPS vérifié (le navigateur s'en souvient 6 mois).
    # add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # On écrase l'en-tête (pas d'ajout) : un client ne peut pas se faire passer
        # pour une autre IP auprès du rate limiting de l'API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
