# Nginx du VPS (hôte) : /etc/nginx/sites-available/canapact.fr
# Ne touche à aucun autre site. Après
# `certbot --nginx -d canapact.fr -d www.canapact.fr -d canapact.adrien-cassar.fr`,
# Certbot ajoute lui-même les blocs 443 (certificat Let's Encrypt commun aux
# trois noms) et la redirection HTTP -> HTTPS. Les lignes `listen 80` ci-dessous restent valables.

# Adresse principale.
server {
    listen 80;
    listen [::]:80;
    server_name canapact.fr;

    # Journaux propres à Canapact (rotation : /etc/logrotate.d/nginx).
    access_log /var/log/nginx/canapact.access.log;
    error_log /var/log/nginx/canapact.error.log;

    client_max_body_size 1m;

    # HSTS : à décommenter une fois le HTTPS vérifié (le navigateur s'en souvient 6 mois).
    # add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # On écrase l'en-tête (pas d'ajout) : un client ne peut pas se faire passer
        # pour une autre IP auprès du rate limiting de l'API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# www : redirection permanente vers canapact.fr, chemin et paramètres conservés.
server {
    listen 80;
    listen [::]:80;
    server_name www.canapact.fr;

    access_log /var/log/nginx/canapact.access.log;
    error_log /var/log/nginx/canapact.error.log;

    return 301 https://canapact.fr$request_uri;
}

# Ancienne adresse : elle doit rester transparente, d'où plus qu'une redirection.
# - Les pages passent par /api/auth/handoff : l'API transmet la session à
#   canapact.fr (le cookie est lié à l'adresse), puis renvoie vers la même page.
#   Sans session, simple redirection. Liens d'emails, favoris et partages
#   restent valables.
# - L'API reste servie ici : un onglet resté ouvert continue de marcher.
# - /sw.js : tout navigateur passé par l'ancienne adresse a son service worker,
#   qui sert l'app en cache sans jamais voir de redirection. Celui-ci le
#   remplace (le navigateur le revérifie à chaque visite), vide le cache, se
#   désinstalle et recharge les onglets, qui suivent alors le chemin ci-dessus.
server {
    listen 80;
    listen [::]:80;
    server_name canapact.adrien-cassar.fr;

    access_log /var/log/nginx/canapact.access.log;
    error_log /var/log/nginx/canapact.error.log;

    client_max_body_size 1m;

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 "self.addEventListener('install', () => self.skipWaiting());
self.addEventListener('activate', (event) => event.waitUntil((async () => {
  for (const key of await caches.keys()) await caches.delete(key);
  await self.registration.unregister();
  for (const client of await self.clients.matchAll({ type: 'window' })) client.navigate(client.url);
})()));
";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 302 et non 301 : la réponse dépend de la session, le navigateur ne doit
    # pas la mémoriser.
    location / {
        return 302 /api/auth/handoff$request_uri;
    }
}
