name: Deploy

# Après chaque CI verte sur main (donc après chaque merge) : images Docker
# publiées sur GHCR, puis mise à jour du VPS en SSH (deploy/deploy.sh).
# À la main (onglet Actions > Deploy > Run workflow, branche main) : sans SHA,
# reconstruit et déploie main ; avec le SHA d'une version déjà publiée, la
# redéploie telle quelle (retour en arrière, sans reconstruire).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA (40 caractères) d'une version déjà publiée, pour revenir en arrière. Vide = déployer main.
        required: false
        default: ''

permissions:
  contents: read

# Un déploiement à la fois, sans en annuler un en cours.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/acassar/watchlist
  # Version choisie (retour en arrière), commit testé par la CI (workflow_run)
  # ou tête de main (lancement manuel).
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    # Lancement manuel : depuis main seulement, sinon une branche quelconque
    # publierait le tag latest.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sha == '') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ env.SHA }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: images
    # Après des images fraîches, ou directement pour un retour en arrière.
    if: >-
      always() && (needs.images.result == 'success' ||
      (needs.images.result == 'skipped' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sha != ''))
    runs-on: ubuntu-latest
    # Secrets VPS_* rangés dans l'environnement « production » (Settings > Environments).
    environment:
      name: production
      url: https://canapact.fr
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: deploy

      - name: Clé SSH et empreinte du VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Empreinte épinglée : on refuse tout serveur qui ne serait pas le VPS.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_PORT" "$VPS_USER" > ~/.ssh/config

      - name: Compose de cette version
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "SHA invalide : $SHA"; exit 1; }
          # Version écrite en dur : un `docker compose up -d` lancé plus tard sur
          # le VPS (après une modification du .env) garde la même version.
          sed "s/\${IMAGE_TAG:-latest}/$SHA/g" deploy/compose.prod.yml > compose.next.yml
          test "$(grep -c "watchlist-[a-z]*:$SHA\$" compose.next.yml)" -eq 3

      - name: Copie des fichiers
        run: scp compose.next.yml deploy/deploy.sh deploy/backup.sh vps:/srv/canapact/

      - name: Migrations et mise à jour des conteneurs
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # Jeton du job (valable pendant le job seulement) passé sur l'entrée
        # standard : il n'apparaît ni dans la commande ni sur le disque du VPS.
        run: printf '%s' "$GHCR_TOKEN" | ssh vps "bash /srv/canapact/deploy.sh '$SHA' '$GHCR_USER'"

      - name: Vérification publique
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://canapact.fr/api/health
