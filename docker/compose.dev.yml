# Base de données de développement : `pnpm db:up`
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
      POSTGRES_DB: watchlist
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchlist']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
